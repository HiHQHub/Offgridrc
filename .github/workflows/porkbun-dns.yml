name: Repair Resend sending DNS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/porkbun-dns.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          API_KEY: ${{ secrets.PORKBUNAPIKEY }}
          SECRET_KEY: ${{ secrets.PORKBUNSECRETAPIKEY }}
        run: |
          if [ -z "$API_KEY" ] || [ -z "$SECRET_KEY" ]; then
            if [ -z "$API_KEY" ]; then echo "::error::PORKBUNAPIKEY is not available to this run"; fi
            if [ -z "$SECRET_KEY" ]; then echo "::error::PORKBUNSECRETAPIKEY is not available to this run"; fi
            echo "::notice::Check that these are Actions repository secrets for HiHQHub/Offgridrc; values are never printed."
            exit 1
          fi
      - name: Ensure Resend SPF records in Porkbun DNS
        env:
          API_KEY: ${{ secrets.PORKBUNAPIKEY }}
          SECRET_KEY: ${{ secrets.PORKBUNSECRETAPIKEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          base = "https://api.porkbun.com/api/json/v3"
          domain = "offgridrc.com"
          def clean(name):
              value = os.environ[name].strip()
              if len(value)>1 and value[0]==value[-1] and value[0] in ("'", '"'):
                  value = value[1:-1].strip()
              if not value or any(ch.isspace() for ch in value):
                  raise RuntimeError("Credential formatting is invalid; update the corresponding repository secret securely")
              return value
          auth = {"apikey": clean("API_KEY"), "secretapikey": clean("SECRET_KEY")}
          for value in auth.values():
              print("::add-mask::" + value)
          def call(path, data):
              req = urllib.request.Request(base + path, data=json.dumps(dict(auth, **data)).encode(), headers={"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      obj = json.load(r)
              except urllib.error.HTTPError as e:
                  # Do not print response bodies or credentials.
                  if e.code == 400 and "001" in str(e.reason):
                      raise RuntimeError("Porkbun rejected the API key/secret pair (001). Replace both secrets with a matching active pair.") from None
                  try:
                      detail = json.loads(e.read())
                  except (ValueError, UnicodeDecodeError):
                      detail = {}
                  message = str(detail.get("message", "No error detail"))
                  for secret in auth.values():
                      message = message.replace(secret, "[redacted]")
                  message = message.replace("\\n", " ").replace("\\r", " ")[:240]
                  raise RuntimeError(f"Porkbun request failed with HTTP {e.code}: {message}") from None
              if obj.get("status") != "SUCCESS":
                  raise RuntimeError(f"Porkbun API failed: {obj.get('message',obj.get('status'))}")
              return obj
          call("/ping", {})
          print("Porkbun authentication: successful")
          rows = call("/dns/retrieve/" + domain, {}).get("records", [])
          wanted = [
              ("MX", "send", "feedback-smtp.eu-west-1.amazonses.com", "10"),
              ("TXT", "send", "v=spf1 include:amazonses.com ~all", None)
          ]
          for kind, name, value, prio in wanted:
              fqdn = name + "." + domain
              matches = [r for r in rows if r.get("type", "").upper()==kind and r.get("name","").rstrip(".").lower()==fqdn]
              exact = [r for r in matches if r.get("content","").rstrip(".")==value.rstrip(".") and (prio is None or str(r.get("prio"))==prio)]
              if exact:
                  print(f"{kind} {fqdn}: already correct")
                  continue
              if len(matches)>1:
                  raise RuntimeError(f"Multiple {kind} records at {fqdn}; manual review required to avoid disrupting DNS")
              data={"name":name,"type":kind,"content":value,"ttl":"600"}
              if prio is not None:
                  data["prio"]=prio
              if len(matches)==1:
                  print(f"Updating {kind} {fqdn}")
                  call("/dns/edit/" + domain + "/" + str(matches[0]["id"]), data)
              else:
                  print(f"Creating {kind} {fqdn}")
                  call("/dns/create/" + domain, data)
          print("Porkbun changes submitted. Check DNS authority and reverify in Resend.")
          PY