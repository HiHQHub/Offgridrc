name: Connect RE3L customer portal hostname
on:
  push:
    branches: [re3l-foundation]
    paths: ['.github/workflows/re3l-mail-domain.yml']
permissions:
  contents: read
concurrency:
  group: re3l-mail-domain-dns
  cancel-in-progress: false
jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Add only the approved mail.re3l.com CNAME
        env:
          API_KEY: ${{ secrets.PORKBUNAPIKEY }}
          SECRET_KEY: ${{ secrets.PORKBUNSECRETAPIKEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, datetime
          if datetime.datetime.now(datetime.timezone.utc).date().isoformat() != '2026-10-13':
              raise SystemExit('One-day authorized setup window ended; no DNS writes')
          def credential(name):
              value = os.environ.get(name, '').strip()
              if len(value) > 1 and value[0] == value[-1] and value[0] in ("'", '"'):
                  value = value[1:-1].strip()
              if not value or any(c.isspace() for c in value):
                  raise SystemExit('Missing or malformed existing repository credential')
              return value
          auth = {'apikey': credential('API_KEY'), 'secretapikey': credential('SECRET_KEY')}
          def call(path, data=None):
              request = urllib.request.Request('https://api.porkbun.com/api/json/v3' + path,
                  data=json.dumps(dict(auth, **(data or {}))).encode(),
                  headers={'Content-Type':'application/json'}, method='POST')
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as error:
                  raise SystemExit('Porkbun rejected request: HTTP ' + str(error.code)) from None
              except (urllib.error.URLError, TimeoutError, ValueError):
                  raise SystemExit('Porkbun request unavailable; reconcile state before retry') from None
              if payload.get('status') != 'SUCCESS':
                  raise SystemExit('Porkbun rejected domain access or DNS operation')
              return payload
          domain, host, target = 're3l.com', 'mail.re3l.com', '11f570ac95ac9b50.vercel-dns-017.com'
          rows = call('/dns/retrieve/' + domain).get('records', [])
          matches = [r for r in rows if r.get('name','').rstrip('.').lower() == host]
          def snapshot(records):
              return sorted(json.dumps(r, sort_keys=True) for r in records if r.get('name','').rstrip('.').lower() != host)
          if matches:
              if len(matches) != 1 or matches[0].get('type') != 'CNAME' or matches[0].get('content','').rstrip('.').lower() != target:
                  raise SystemExit('Conflicting existing mail.re3l.com record; no DNS writes')
              print('Approved CNAME already exists; no DNS write needed')
          else:
              call('/dns/create/' + domain, {'name':'mail','type':'CNAME','content':target,'ttl':'600'})
              print('Created only CNAME mail.re3l.com -> ' + target)
          after = call('/dns/retrieve/' + domain).get('records', [])
          expected = [r for r in after if r.get('name','').rstrip('.').lower() == host and r.get('type') == 'CNAME' and r.get('content','').rstrip('.').lower() == target]
          if len(expected) != 1:
              raise SystemExit('CNAME post-write verification failed; do not automatically retry')
          if snapshot(rows) != snapshot(after):
              raise SystemExit('Unrelated records changed concurrently; operator review required')
          print('PASS: approved CNAME verified; all other re3l.com records unchanged')
          print('No offgridrc.com DNS, MX, TXT, nameserver or live webhook operations performed')
          PY
